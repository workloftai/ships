# egress-gate policy (example; ours lists our own private paths).
# Deterministic: the gate reads this file and the session's taint record,
# nothing else. No network, no model.
#
# mode = "monitor"  -> tainted_flow logs "would_block" but allows
# mode = "enforce"  -> tainted_flow blocks
# The secret rule ALWAYS blocks, in either mode.

mode = "monitor"

# Hosts trusted to receive data from a tainted session.
allow_hosts = [
  "arxiv.org", "huggingface.co",
  "github.com", "raw.githubusercontent.com", "api.github.com",
  "anthropic.com", "docs.anthropic.com", "claude.com",
]

# (Top-level keys must sit above the first [[table]] or TOML folds them into it.)
# .env files whose values are treated as secrets for the payload scan.
secret_env_files = ["~/.env", "~/app/.env", "~/app/.env.local"]

# Reading any of these marks the session as tainted with the given label.
# Globs match file paths in Read/Grep/Glob input and the text of Bash commands.
[[taint_sources]]
label = "secrets"
patterns = ["**/.env", "**/.env.*", "**/.ssh/*", "**/.aws/*", "*SERVICE_ROLE_KEY*", "*_TOKEN*", "*API_KEY*"]

[[taint_sources]]
label = "client-confidential"
patterns = ["**/call-transcripts/*", "**/clients/*"]

[[taint_sources]]
label = "personal"
patterns = ["**/notes/private/*", "**/todo.md"]
